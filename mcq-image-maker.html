
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepareKora | MCQ Image Maker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    background: #ededed;
    color: #171717;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 24px;
}

.brand {
    color: #171717;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.7px;
}

.brand span {
    color: #999;
}

.back-link {
    color: #555;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
}

.back-link:hover {
    color: #111;
}

.panel {
    padding: 24px;
    background: #fff;
    border: 1px solid #dedede;
    border-radius: 8px;
    margin-bottom: 20px;
}

.panel h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: -0.5px;
}

.description {
    margin: 8px 0 20px;
    color: #737373;
    font-size: 12px;
    line-height: 1.7;
}

#input {
    width: 100%;
    min-height: 280px;
    padding: 15px;
    resize: vertical;
    border: 1px solid #d7d7d7;
    border-radius: 6px;
    background: #fcfcfc;
    color: #222;
    font-family: "Noto Sans Bengali", Arial, sans-serif;
    font-size: 13px;
    line-height: 1.8;
    outline: none;
}

#input:focus {
    border-color: #777;
    box-shadow: 0 0 0 2px rgba(0,0,0,.05);
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
}

button {
    min-height: 42px;
    padding: 10px 18px;
    border: 1px solid transparent;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

#gen,
#download {
    background: #171717;
    color: #fff;
}

#gen:hover,
#download:hover {
    background: #383838;
}

#clear {
    border-color: #d8d8d8;
    background: #fff;
    color: #333;
}

#clear:hover {
    background: #f2f2f2;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

#msg {
    min-height: 20px;
    margin-top: 13px;
    color: #666;
    font-size: 12px;
    line-height: 1.6;
}

#msg.error {
    color: #b42318;
}

#msg.success {
    color: #267348;
}

.preview-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 13px;
}

.preview-heading h2 {
    margin: 0;
    font-size: 15px;
}

.preview-heading span {
    color: #888;
    font-size: 10px;
}

.canvas-wrap {
    width: 100%;
    overflow: hidden;
    background: #f5f5f5;
    border: 1px solid #ddd;
    border-radius: 6px;
}

#capture {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
}

.footer {
    padding: 15px 0;
    color: #888;
    font-size: 10px;
    text-align: center;
}

@media (max-width: 600px) {
    body {
        padding: 13px;
    }

    .panel {
        padding: 16px;
    }

    .header {
        align-items: flex-start;
    }

    .brand {
        font-size: 19px;
    }

    .actions {
        flex-direction: column;
    }

    .actions button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="brand">
            Preparekora<span>.in</span>
        </div>

        <a class="back-link" href="index.html">
            Back to Studio
        </a>
    </header>


    <main id="tool-mcq">

        <section class="panel">

            <h1>MCQ Image Maker</h1>

            <p class="description">
                Create an independent bilingual MCQ image.
                Enter the English and Assamese question with four options.
            </p>

            <textarea
                id="input"
                spellcheck="false"
                placeholder="Topic: General Knowledge

Q: Who wrote the famous Assamese folk tale collection Burhi Aair Sadhu?

Q(as): বুঢ়ী আইৰ সাধু নামৰ বিখ্যাত অসমীয়া লোককথা সংকলনটো কোনে লিখিছিল?

A) Hemchandra Barua (হেমচন্দ্ৰ বৰুৱা)
B) Lakshminath Bezbaroa (লক্ষ্মীনাথ বেজবৰুৱা)
C) Jyoti Prasad Agarwala (জ্যোতিপ্ৰসাদ আগৰৱালা)
D) Chandrakumar Agarwala (চন্দ্ৰকুমাৰ আগৰৱালা)"
            ></textarea>

            <div class="actions">

                <button type="button" id="gen">
                    Generate Image
                </button>

                <button type="button" id="download" disabled>
                    Download PNG
                </button>

                <button type="button" id="clear">
                    Clear
                </button>

            </div>

            <div id="msg" role="status" aria-live="polite"></div>

        </section>


        <section class="panel">

            <div class="preview-heading">

                <h2>Image Preview</h2>

                <span>1920 × 1080 · 16:9</span>

            </div>

            <div class="canvas-wrap">

                <canvas
                    id="capture"
                    width="1920"
                    height="1080"
                ></canvas>

            </div>

        </section>

    </main>


    <footer class="footer">
        PREPAREKORA.IN · MCQ IMAGE MAKER
    </footer>

</div>


<script>
/* =====================================================
   PREPAREKORA
   INDEPENDENT MCQ IMAGE MAKER

   Storage:
   mcqImageMaker.serialId

   Initial serial:
   0026

   Output:
   1920 × 1080 PNG

   Independent from PDF Builder and Thumbnail Maker.
===================================================== */

(function (window, document) {

    "use strict";


    /* ================= ELEMENTS ================= */

    const input = document.getElementById("input");
    const generateButton = document.getElementById("gen");
    const downloadButton = document.getElementById("download");
    const clearButton = document.getElementById("clear");
    const message = document.getElementById("msg");
    const canvas = document.getElementById("capture");

    const context = canvas.getContext("2d");


    /* ================= CONFIGURATION ================= */

    const STORAGE_KEY = "mcqImageMaker.serialId";

    const INITIAL_SERIAL = 26;

    const WIDTH = 1920;
    const HEIGHT = 1080;


    /* ================= STATE ================= */

    let serialId = loadSerial();

    let currentQuestion = null;

    let imageGenerated = false;


    /* ================= SERIAL STORAGE ================= */

    function loadSerial() {

        try {

            const stored = localStorage.getItem(STORAGE_KEY);

            if (stored === null) {
                return INITIAL_SERIAL;
            }

            const value = Number(stored);

            if (
                !Number.isSafeInteger(value) ||
                value < INITIAL_SERIAL
            ) {
                return INITIAL_SERIAL;
            }

            return value;

        } catch (error) {

            console.warn("Unable to access MCQ serial storage.", error);

            return INITIAL_SERIAL;

        }
    }


    function saveSerial(value) {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                String(value)
            );

            return true;

        } catch (error) {

            console.error("Unable to save MCQ serial.", error);

            return false;

        }
    }


    function formatSerial(value) {

        return String(value).padStart(4, "0");

    }


    /* ================= MESSAGE ================= */

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type || "";

    }


    /* ================= INPUT HELPERS ================= */

    function cleanText(value) {

        return String(value || "").trim();

    }


    function splitBilingualOption(value) {

        const text = cleanText(value);

        if (!text) {
            return {
                english: "",
                assamese: ""
            };
        }


        /* Pipe-separated format */

        const pipePosition = text.indexOf("|");

        if (pipePosition !== -1) {

            return {
                english: text.slice(0, pipePosition).trim(),
                assamese: text.slice(pipePosition + 1).trim()
            };

        }


        /* Trailing Assamese text inside parentheses */

        const match = text.match(/^(.*?)\s*\(([^()]*)\)\s*$/);


        if (match) {

            return {
                english: match[1].trim(),
                assamese: match[2].trim()
            };

        }


        return {
            english: text,
            assamese: ""
        };

    }


    /* ================= MCQ PARSER ================= */

    function parseInput(rawInput) {

        const lines = String(rawInput || "")
            .replace(/\r\n?/g, "\n")
            .split("\n");


        const data = {

            topic: "GENERAL KNOWLEDGE",

            question: "",

            questionAssamese: "",

            options: [],

            serial: formatSerial(serialId)

        };


        const errors = [];

        let questionStarted = false;

        let currentOption = null;


        lines.forEach(function (rawLine, index) {

            const line = cleanText(rawLine);

            if (!line) {
                return;
            }


            /* TOPIC */

            const topicMatch = line.match(/^Topic\s*:\s*(.*)$/i);

            if (topicMatch) {

                data.topic = cleanText(topicMatch[1]).toUpperCase();

                return;

            }


            /* ENGLISH QUESTION */

            const englishMatch = line.match(/^Q\s*:\s*(.*)$/i);

            if (englishMatch) {

                if (questionStarted) {

                    errors.push(
                        "Only one English question is allowed in this image."
                    );

                    return;
                }

                questionStarted = true;

                data.question = cleanText(englishMatch[1]);

                currentOption = null;

                return;

            }


            /* ASSAMESE QUESTION */

            const assameseMatch = line.match(/^Q\s*\(\s*as\s*\)\s*:\s*(.*)$/i);

            if (assameseMatch) {

                if (data.questionAssamese) {

                    errors.push(
                        "Duplicate Assamese question."
                    );

                    return;

                }

                data.questionAssamese = cleanText(assameseMatch[1]);

                currentOption = null;

                return;

            }


            /* OPTIONS A-D */

            const optionMatch = line.match(/^([A-D])\s*[.)]\s*(.*)$/i);

            if (optionMatch) {

                const label = optionMatch[1].toUpperCase();

                const optionText = cleanText(optionMatch[2]);


                if (
                    data.options.some(function (option) {
                        return option.label === label;
                    })
                ) {

                    errors.push(
                        "Duplicate option " + label + "."
                    );

                    return;

                }


                const bilingual = splitBilingualOption(optionText);


                data.options.push({

                    label: label,

                    english: bilingual.english,

                    assamese: bilingual.assamese

                });


                currentOption = label;

                return;

            }


            /* MULTILINE QUESTION / OPTION CONTINUATION */

            if (!questionStarted) {

                errors.push(
                    "Unexpected text at line " + (index + 1) + "."
                );

                return;

            }


            if (currentOption) {

                const option = data.options.find(function (item) {
                    return item.label === currentOption;
                });


                if (option) {

                    const continuation = splitBilingualOption(line);

                    option.english +=
                        (option.english ? " " : "") +
                        continuation.english;


                    option.assamese +=
                        (option.assamese ? " " : "") +
                        continuation.assamese;

                }

                return;

            }


            if (data.questionAssamese && !data.question) {

                data.questionAssamese += " " + line;

                return;

            }


            if (data.questionAssamese) {

                data.questionAssamese += " " + line;

            } else {

                data.question += " " + line;

            }

        });


        /* ================= VALIDATION ================= */

        if (!data.topic) {
            errors.push("Topic is missing.");
        }

        if (!data.question) {
            errors.push("English question is missing.");
        }

        if (!data.questionAssamese) {
            errors.push("Assamese question is missing. Use Q(as):.");
        }

        if (data.options.length !== 4) {
            errors.push("Exactly four options A, B, C and D are required.");
        }


        const expected = ["A", "B", "C", "D"];


        data.options.forEach(function (option, index) {

            if (option.label !== expected[index]) {

                errors.push(
                    "Options must be in A, B, C, D order."
                );

            }

            if (!option.english) {

                errors.push(
                    "English text is missing for option " + option.label + "."
                );

            }

        });


        return {

            valid: errors.length === 0,

            errors: errors,

            data: errors.length === 0 ? data : null

        };

    }


    /* ================= CANVAS HELPERS ================= */

    function roundedRect(ctx, x, y, width, height, radius) {

        ctx.beginPath();

        ctx.roundRect(
            x,
            y,
            width,
            height,
            radius
        );

    }


    function drawText(
        text,
        x,
        y,
        font,
        color,
        maxWidth,
        lineHeight
    ) {

        context.font = font;

        context.fillStyle = color;

        context.textAlign = "left";

        context.textBaseline = "top";


        const words = String(text || "").split(/\s+/);

        const lines = [];

        let currentLine = "";


        words.forEach(function (word) {

            const testLine =
                currentLine ? currentLine + " " + word : word;


            if (
                currentLine &&
                context.measureText(testLine).width > maxWidth
            ) {

                lines.push(currentLine);

                currentLine = word;

            } else {

                currentLine = testLine;

            }

        });


        if (currentLine) {
            lines.push(currentLine);
        }


        lines.forEach(function (line, index) {

            context.fillText(
                line,
                x,
                y + index * lineHeight
            );

        });


        return lines.length * lineHeight;

    }


    function drawCentered(text, x, y, font, color) {

        context.font = font;

        context.fillStyle = color;

        context.textAlign = "center";

        context.textBaseline = "middle";

        context.fillText(text, x, y);

        context.textAlign = "left";

    }


    /* ================= OPTION CARD ================= */

    function drawOption(option, x, y, width, height) {

        context.fillStyle = "#ffffff";

        roundedRect(
            context,
            x,
            y,
            width,
            height,
            20
        );

        context.fill();


        context.strokeStyle = "#dedede";

        context.lineWidth = 2;

        roundedRect(
            context,
            x,
            y,
            width,
            height,
            20
        );

        context.stroke();


        context.fillStyle = "#171717";

        roundedRect(
            context,
            x + 22,
            y + 22,
            62,
            62,
            15
        );

        context.fill();


        drawCentered(
            option.label,
            x + 53,
            y + 53,
            "bold 29px Arial",
            "#ffffff"
        );


        const textX = x + 110;

        const textWidth = width - 140;


        const englishHeight = drawText(
            option.english,
            textX,
            y + 27,
            "600 25px Arial",
            "#222222",
            textWidth,
            33
        );


        if (option.assamese) {

            drawText(
                option.assamese,
                textX,
                y + 38 + englishHeight,
                '400 23px "Noto Sans Bengali"',
                "#555555",
                textWidth,
                32
            );

        }

    }


    /* ================= DRAW IMAGE ================= */

    async function drawImage(data) {

        if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
        }


        context.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /* Background */

        context.fillStyle = "#f1f1f1";

        context.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /* Outer panel */

        context.fillStyle = "#ffffff";

        roundedRect(
            context,
            48,
            48,
            WIDTH - 96,
            HEIGHT - 96,
            28
        );

        context.fill();


        context.strokeStyle = "#d7d7d7";

        context.lineWidth = 2;

        roundedRect(
            context,
            48,
            48,
            WIDTH - 96,
            HEIGHT - 96,
            28
        );

        context.stroke();


        /* Header */

        context.fillStyle = "#171717";

        context.fillRect(
            48,
            48,
            WIDTH - 96,
            12
        );


        context.font = "bold 37px Arial";

        context.fillStyle = "#171717";

        context.fillText(
            "Preparekora.in",
            105,
            143
        );


        context.font = "600 19px Arial";

        context.fillStyle = "#777777";

        context.fillText(
            "MCQ PRACTICE",
            107,
            178
        );


        /* Serial badge */

        context.fillStyle = "#171717";

        roundedRect(
            context,
            WIDTH - 300,
            105,
            170,
            58,
            12
        );

        context.fill();


        drawCentered(
            "MCQ " + data.serial,
            WIDTH - 215,
            134,
            "bold 21px Arial",
            "#ffffff"
        );


        /* Topic */

        context.fillStyle = "#ededed";

        roundedRect(
            context,
            105,
            220,
            360,
            50,
            12
        );

        context.fill();


        drawText(
            data.topic,
            125,
            232,
            "bold 20px Arial",
            "#444444",
            320,
            27
        );


        /* Question section */

        context.fillStyle = "#fafafa";

        roundedRect(
            context,
            105,
            310,
            WIDTH - 210,
            270,
            20
        );

        context.fill();


        drawText(
            "QUESTION",
            140,
            345,
            "bold 18px Arial",
            "#777777",
            500,
            25
        );


        const englishHeight = drawText(
            data.question,
            140,
            395,
            "bold 34px Arial",
            "#171717",
            WIDTH - 280,
            45
        );


        drawText(
            data.questionAssamese,
            140,
            415 + englishHeight,
            '500 30px "Noto Sans Bengali"',
            "#404040",
            WIDTH - 280,
            43
        );


        /* Options */

        const optionStartY = 620;

        const cardWidth = 815;

        const cardHeight = 150;

        const horizontalGap = 35;

        const verticalGap = 30;


        data.options.forEach(function (option, index) {

            const column = index % 2;

            const row = Math.floor(index / 2);


            const x =
                105 +
                column * (cardWidth + horizontalGap);


            const y =
                optionStartY +
                row * (cardHeight + verticalGap);


            drawOption(
                option,
                x,
                y,
                cardWidth,
                cardHeight
            );

        });


        /* Footer */

        context.strokeStyle = "#dddddd";

        context.lineWidth = 2;

        context.beginPath();

        context.moveTo(105, 1000);

        context.lineTo(WIDTH - 105, 1000);

        context.stroke();


        drawText(
            "🙏  Learn · Practice · Succeed",
            110,
            1018,
            "600 20px Arial",
            "#666666",
            700,
            25
        );


        context.textAlign = "right";

        context.font = "600 19px Arial";

        context.fillStyle = "#777777";

        context.fillText(
            "Har Har Mahadev ♥️ 👍",
            WIDTH - 110,
            1040
        );

        context.textAlign = "left";

    }


    /* ================= FILE NAME ================= */

    function createFileName(question) {

        const slug = String(question || "mcq")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 65);


        return (slug || "mcq") + ".png";

    }


    /* ================= GENERATE ================= */

    async function generate() {

        generateButton.disabled = true;

        downloadButton.disabled = true;

        imageGenerated = false;


        try {

            const result = parseInput(input.value);


            if (!result.valid) {

                showMessage(
                    result.errors.join(" "),
                    "error"
                );

                return;

            }


            const nextSerial = serialId + 1;


            result.data.serial = formatSerial(nextSerial);


            await drawImage(result.data);


            /*
             * Increase the serial only after the image
             * has been rendered successfully.
             */

            if (!saveSerial(nextSerial)) {

                throw new Error(
                    "Image generated, but its serial number could not be saved."
                );

            }


            serialId = nextSerial;

            currentQuestion = result.data;

            imageGenerated = true;


            downloadButton.disabled = false;


            showMessage(
                "Image generated successfully. Serial: " +
                result.data.serial,
                "success"
            );


        } catch (error) {

            console.error(
                "MCQ Image Maker error:",
                error
            );


            showMessage(
                error.message || "Unable to generate the image.",
                "error"
            );


        } finally {

            generateButton.disabled = false;

        }

    }


    /* ================= DOWNLOAD ================= */

    function downloadImage() {

        if (!imageGenerated || !currentQuestion) {

            showMessage(
                "Generate an image before downloading.",
                "error"
            );

            return;

        }


        canvas.toBlob(function (blob) {

            if (!blob) {

                showMessage(
                    "PNG export failed. Please generate the image again.",
                    "error"
                );

                return;

            }


            const objectUrl = URL.createObjectURL(blob);

            const link = document.createElement("a");


            link.href = objectUrl;

            link.download = createFileName(
                currentQuestion.question
            );


            document.body.appendChild(link);

            link.click();

            link.remove();


            window.setTimeout(function () {

                URL.revokeObjectURL(objectUrl);

            }, 2000);


            showMessage(
                "PNG downloaded successfully.",
                "success"
            );

        }, "image/png");

    }


    /* ================= CLEAR ================= */

    function clearInput() {

        input.value = "";

        currentQuestion = null;

        imageGenerated = false;

        downloadButton.disabled = true;


        context.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        showMessage(
            "Input cleared.",
            ""
        );

    }


    /* ================= EVENTS ================= */

    generateButton.addEventListener(
        "click",
        generate
    );


    downloadButton.addEventListener(
        "click",
        downloadImage
    );


    clearButton.addEventListener(
        "click",
        clearInput
    );


    /* ================= ORIGINAL TOOL API ================= */

    window.MCQTool = {

        refresh: function () {

            return true;

        },

        generate: generate,

        download: downloadImage,

        parse: parseInput,

        version: "1.0.0"

    };


    /* ================= INITIALIZATION ================= */

    context.fillStyle = "#f1f1f1";

    context.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


})(window, document);
</script>

</body>
</html>
